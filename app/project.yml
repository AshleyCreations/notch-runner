name: NotchRunner
options:
  bundleIdPrefix: io.github.ashleycreations
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # The release workflow overrides MARKETING_VERSION with the git tag.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    ENABLE_HARDENED_RUNTIME: NO

targets:
  NotchRunner:
    type: application
    platform: macOS
    sources:
      - path: NotchRunner
        excludes:
          - Resources/game
          - Resources/notch-runner-hook.sh
          - Resources/playbot.md
      # A folder reference, not a group: the web view looks the page up with
      # subdirectory "game", which only works if the folder survives into the
      # bundle instead of being flattened into Resources.
      - path: NotchRunner/Resources/game
        type: folder
      # install.sh copies this out of the bundle, so it has to be a resource.
      - path: NotchRunner/Resources/notch-runner-hook.sh
        buildPhase: resources
      # The /playbot slash command, copied into ~/.claude/commands by install.sh.
      - path: NotchRunner/Resources/playbot.md
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleName: NotchRunner
        CFBundleDisplayName: Notch Runner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MIT License"
        NSAppleEventsUsageDescription: "Notch Runner brings your terminal back when Claude finishes."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ashleycreations.notchrunner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
    preBuildScripts:
      # Keeps a local Xcode build in step with /game without re-running the
      # staging script by hand. CI stages before generating the project.
      - name: Stage resources
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/stage-resources.sh"'
