name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-14 was retired on 2 Nov 2026. The deployment target stays at 14.0;
    # that is a build setting and does not follow the runner's OS.
    #
    # Intel rather than arm64: the arm64 pool kept dropping this job with
    # "not acquired by Runner of type hosted" after 15 minutes of queueing.
    # The build is universal either way, since the arm64 slice cross-compiles.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Run the tests
        run: app/Tests/run.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      # The project spec references the staged folder, so this has to happen
      # before the project is generated.
      - name: Stage resources
        run: app/stage-resources.sh

      - name: Generate the Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Work out the version
        id: version
        run: |
          ref="${{ github.ref_name }}"
          echo "marketing=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Build (universal, ad-hoc signed)
        working-directory: app
        run: |
          xcodebuild -project NotchRunner.xcodeproj \
            -scheme NotchRunner -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            build

      - name: Check the bundle
        working-directory: app
        run: |
          APP=build/Build/Products/Release/NotchRunner.app
          echo "--- architectures"
          lipo -info "$APP/Contents/MacOS/NotchRunner"
          echo "--- the game must survive as a folder, not be flattened"
          test -f "$APP/Contents/Resources/game/index.html"
          echo "--- install.sh copies the hook out of here"
          test -f "$APP/Contents/Resources/notch-runner-hook.sh"
          echo "--- the asset catalogue compiled, with an app icon"
          test -f "$APP/Contents/Resources/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP/Contents/Info.plist"
          echo "--- menu-bar only"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"

      - name: Zip
        working-directory: app
        run: ditto -c -k --keepParent build/Build/Products/Release/NotchRunner.app NotchRunner.zip

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: app/NotchRunner.zip
          generate_release_notes: true
