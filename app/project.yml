name: NotchRunner
options:
  bundleIdPrefix: io.github.ashleycreations
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: ${MARKETING_VERSION:-0.1.0}
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.9
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    ENABLE_HARDENED_RUNTIME: NO

targets:
  NotchRunner:
    type: application
    platform: macOS
    sources:
      - path: NotchRunner
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleName: NotchRunner
        CFBundleDisplayName: Notch Runner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MIT License"
        NSAppleEventsUsageDescription: "Notch Runner brings your terminal back when Claude finishes."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ashleycreations.notchrunner
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
    preBuildScripts:
      # One source of truth: the game lives at /game and is copied in at build time.
      - name: Copy game/index.html into Resources
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "$SRCROOT/NotchRunner/Resources/game"
          cp "$SRCROOT/../game/index.html" "$SRCROOT/NotchRunner/Resources/game/index.html"
          cp "$SRCROOT/../hooks/notch-runner-hook.sh" "$SRCROOT/NotchRunner/Resources/notch-runner-hook.sh"
